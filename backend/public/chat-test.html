<!DOCTYPE html>
<html lang="sq">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Socket.IO Rooms Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f3f4f6;
        }

        .container {
            background-color: white;
            padding: 24px;
            border-radius: 10px;
        }

        input,
        button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 10px;
        }

        button {
            cursor: pointer;
        }

        .status {
            font-weight: bold;
            margin-bottom: 15px;
        }

        #messages {
            min-height: 150px;
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #cccccc;
            background-color: #fafafa;
        }

        .message {
            margin-top: 10px;
            padding: 8px;
            background-color: #e5e7eb;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Socket.IO Rooms Test</h1>

        <h2>1. Login</h2>

        <input id="phoneNumber" type="text" placeholder="Numri i telefonit" />

        <input id="password" type="password" placeholder="Fjalëkalimi" />

        <button id="loginButton">
            Login
        </button>

        <p id="loginStatus" class="status">
            Not logged in
        </p>

        <hr />

        <h2>2. Connect Socket</h2>

        <button id="connectButton">
            Connect Socket
        </button>

        <p id="socketStatus" class="status">
            Socket disconnected
        </p>

        <hr />

        <h2>3. Join Room</h2>

        <input id="roomInput" type="text" placeholder="Room ID, për shembull room1" />

        <button id="joinRoomButton">
            Join Room
        </button>

        <p id="roomStatus" class="status">
            Not in a room
        </p>

        <hr />

        <h2>4. Send Message</h2>

        <input id="messageInput" type="text" placeholder="Shkruaj mesazhin" />

        <button id="sendButton">
            Send Message
        </button>

        <div id="messages">
            <strong>Messages:</strong>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        let socket = null;
        let joinedRoomId = null;

        const phoneNumberInput =
            document.getElementById('phoneNumber');

        const passwordInput =
            document.getElementById('password');

        const roomInput =
            document.getElementById('roomInput');

        const messageInput =
            document.getElementById('messageInput');

        const loginStatus =
            document.getElementById('loginStatus');

        const socketStatus =
            document.getElementById('socketStatus');

        const roomStatus =
            document.getElementById('roomStatus');

        const messagesContainer =
            document.getElementById('messages');

        document
            .getElementById('loginButton')
            .addEventListener('click', login);

        document
            .getElementById('connectButton')
            .addEventListener('click', connectSocket);

        document
            .getElementById('joinRoomButton')
            .addEventListener('click', joinRoom);

        document
            .getElementById('sendButton')
            .addEventListener('click', sendMessage);

        messageInput.addEventListener('keydown', event => {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        async function login() {
            const phoneNumber =
                phoneNumberInput.value.trim();

            const password =
                passwordInput.value;

            if (!phoneNumber || !password) {
                loginStatus.textContent =
                    'Plotëso numrin dhe fjalëkalimin.';

                return;
            }

            try {
                const response =
                    await fetch('/auth/phone-login', {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json',
                        },

                        credentials: 'include',

                        body: JSON.stringify({
                            phoneNumber,
                            password,
                        }),
                    });

                const data = await response.json();

                if (!response.ok) {
                    loginStatus.textContent =
                        data.message || 'Login failed';

                    return;
                }

                loginStatus.textContent =
                    'Login successful';

                console.log(
                    'LOGIN RESPONSE:',
                    data,
                );
            } catch (error) {
                console.error(
                    'LOGIN ERROR:',
                    error,
                );

                loginStatus.textContent =
                    'Could not connect to backend';
            }
        }

        function connectSocket() {
            if (socket?.connected) {
                socketStatus.textContent =
                    'Socket already connected';

                return;
            }

            socket = io({
                withCredentials: true,
            });

            socket.on('connect', () => {
                socketStatus.textContent =
                    `Socket connected: ${socket.id}`;

                console.log(
                    'SOCKET CONNECTED:',
                    socket.id,
                );
            });

            socket.on('disconnect', reason => {
                socketStatus.textContent =
                    `Socket disconnected: ${reason}`;

                joinedRoomId = null;

                roomStatus.textContent =
                    'Not in a room';

                console.log(
                    'SOCKET DISCONNECTED:',
                    reason,
                );
            });

            socket.on('connect_error', error => {
                socketStatus.textContent =
                    `Connection error: ${error.message}`;

                console.error(
                    'SOCKET CONNECTION ERROR:',
                    error,
                );
            });

            socket.on('roomJoined', data => {
                joinedRoomId = data.roomId;

                roomStatus.textContent =
                    `Joined room: ${data.roomId}`;

                console.log(
                    'ROOM JOINED RESPONSE:',
                    data,
                );
            });

            socket.on('roomError', data => {
                console.error(
                    'ROOM ERROR:',
                    data,
                );

                alert(data.message);
            });

            socket.on('messageReceived', data => {
                console.log(
                    'MESSAGE RECEIVED:',
                    data,
                );

                displayMessage(data);
            });

            socket.on('messageError', data => {
                console.error(
                    'MESSAGE ERROR:',
                    data,
                );

                alert(data.message);
            });
        }

        function joinRoom() {
            if (!socket?.connected) {
                alert(
                    'Lidhe socket-in fillimisht.',
                );

                return;
            }

            const roomId =
                roomInput.value.trim();

            if (!roomId) {
                alert('Shkruaj room ID.');

                return;
            }

            console.log(
                'SENDING JOIN ROOM:',
                roomId,
            );

            socket.emit(
                'joinRoom',
                roomId,
            );
        }

        function sendMessage() {
            if (!socket?.connected) {
                alert(
                    'Lidhe socket-in fillimisht.',
                );

                return;
            }

            const message =
                messageInput.value.trim();

            if (!joinedRoomId) {
                alert(
                    'Bashkohu fillimisht me një room.',
                );

                return;
            }

            if (!message) {
                alert(
                    'Shkruaj një mesazh.',
                );

                return;
            }

            const data = {
                roomId: joinedRoomId,
                message,
            };

            console.log(
                'SENDING MESSAGE:',
                data,
            );

            socket.emit(
                'sendMessage',
                data,
            );

            messageInput.value = '';
            messageInput.focus();
        }

        function displayMessage(data) {
            const messageElement =
                document.createElement('div');

            messageElement.className =
                'message';

            messageElement.textContent =
                `Room ${data.roomId} | User ${data.userId}: ${data.message}`;

            messagesContainer.appendChild(
                messageElement,
            );
        }
    </script>
</body>

</html>
